name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The four gates of docs/05 §5.2 / CLAUDE.md. All must pass for a commit
  # to be mergeable. They bite from commit 1 (WS0), before any feature code.
  gates:
    name: gates (no-op-return · bsv-only · lint/format · spec-traceability)
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: build the Go sidecar + gate tooling
        run: go build ./...

      - name: gate — lint/format (gofmt check mode, no write)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "lint/format: FAIL — these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
          echo "lint/format: OK"

      - name: gate — go vet
        run: go vet ./...

      - name: gate — no-op-return
        run: go run ./tools/gates/noopreturn

      - name: gate — bsv-only
        run: go run ./tools/gates/bsvonly

      - name: gate — spec-traceability
        run: go run ./tools/gates/spectrace

  test:
    name: go test (unit, hermetic)
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Live (NFTBSV_RUN_LIVE) tests self-skip without the env, so this is
      # the hermetic unit suite (incl. the offline SPV/CH-1 verification).
      - run: go test ./...

  chain-integration:
    name: live regtest chain (WS1 adapter DoD)
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: bring up the SV Node regtest (deploy/regtest)
        run: docker compose -p nftbsv -f deploy/regtest/docker-compose.yml up -d

      - name: wait for node RPC
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -u nftbsv:nftbsv-dev-rpc-password \
                 --data '{"jsonrpc":"1.0","id":"x","method":"getblockcount","params":[]}' \
                 -H 'content-type: application/json' http://127.0.0.1:18332/ >/dev/null 2>&1; then
              echo "node up"; exit 0
            fi
            sleep 2
          done
          echo "node never came up"
          docker compose -p nftbsv -f deploy/regtest/docker-compose.yml logs bsv-node || true
          exit 1

      - name: run the live DoD tests (adapter + wallet + token/M1)
        env:
          NFTBSV_RUN_LIVE: '1'
          NFTBSV_RPC_URL: http://127.0.0.1:18332/
          NFTBSV_RPC_USER: nftbsv
          NFTBSV_RPC_PASS: nftbsv-dev-rpc-password
        # -p 1 serializes package test binaries: the live tests share ONE
        # regtest node + node wallet, so running them concurrently lets one
        # package's MineBlocks/funding race another's swap (observed: a
        # swap left in mempool). Serial execution is correct here.
        run: go test -p 1 -count=1 ./...

      - name: logs on failure
        if: failure()
        run: docker compose -p nftbsv -f deploy/regtest/docker-compose.yml logs bsv-node || true

      - name: tear down
        if: always()
        run: docker compose -p nftbsv -f deploy/regtest/docker-compose.yml down -v || true

  dotnet-shell:
    name: build .NET/C# shell (WS7 compile-verify)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Compile-verifies the WPF shell (the human-driven E2E-8-through-UI
      # acceptance, M4, is run by an operator — see
      # docs/runbooks/running-the-shell.md).
      - run: dotnet build apps/shell/shell.csproj -c Release
